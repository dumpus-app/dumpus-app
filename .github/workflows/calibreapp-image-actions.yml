name: Compress Images
on:
  workflow_dispatch:
  schedule:
    - cron: "00 23 * * 0"
jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@1.5.0
        with:
          compressOnly: true
          # `pngQuality` quantizes colors, which would break the e2e screenshot
          # comparisons, and turns PNGs into palette images, which Tauri 2
          # refuses as icons.
          ignorePaths: "node_modules/**,e2e/__screenshots__/**,src-tauri/icons/**"

      - name: Create New Pull Request If Needed
        if: steps.calibre.outputs.markdown != ''
        uses: peter-evans/create-pull-request@v8
        with:
          title: Compressed Images Nightly
          branch-suffix: timestamp
          commit-message: Compressed Images
          body: ${{ steps.calibre.outputs.markdown }}
