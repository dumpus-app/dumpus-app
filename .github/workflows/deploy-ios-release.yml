# cd.yml
name: iOS Deployment

on:
  release:
    types: [created]
  # A manual run builds and signs without uploading, to check the toolchain
  # and the certificates before a release; `prod` uploads, as a release does.
  workflow_dispatch:
    inputs:
      lane:
        description: fastlane lane
        type: choice
        options: [buildtest, prod]
        default: buildtest

jobs:
  deploy_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mobile App
        run: pnpm run build:mobile

      - name: Sync iOS files
        run: pnpm cap sync ios

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup SSH Keys and known_hosts for fastlane match
        run: |
          SSH_PATH="$HOME/.ssh"
          mkdir -p "$SSH_PATH"
          touch "$SSH_PATH/known_hosts"    
          echo "$SSH_PRIVATE_KEY" > "$SSH_PATH/id_rsa"    
          chmod 700 "$SSH_PATH"
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 "$SSH_PATH/known_hosts"
          chmod 600 "$SSH_PATH/id_rsa"    
          eval $(ssh-agent)
          ssh-add "$SSH_PATH/id_rsa"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Decrypt iOS keys
        run: sh ./.github/scripts/decrypt_ios_keys.sh
        env:
          APP_KEYS_SECRET_PASSPHRASE: ${{ secrets.APP_KEYS_SECRET_PASSPHRASE }}

      - name: Install Pods
        working-directory: ios/App
        run: |
          pod install

      - name: Download bundle dependencies
        run: |
          bundle config path vendor/bundle
          bundle install
        working-directory: ios/App/fastlane

      - name: fastlane
        working-directory: ios/App
        run: |
          export LC_ALL=fr_FR.UTF-8
          export LANG=fr_FR.UTF-8
          bundle exec fastlane "$LANE" --verbose
        env:
          LANE: ${{ inputs.lane || 'prod' }}
          FASTLANE_VERBOSE: "1"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          APP_STORE_KEY_ID: ${{ vars.APP_STORE_KEY_ID }}
          APP_STORE_TEAM_ID: ${{ vars.APP_STORE_TEAM_ID }}
          APP_STORE_APP_APPLE_ID: ${{ vars.APP_STORE_APP_APPLE_ID }}
          APP_STORE_APP_IDENTIFIER: ${{ vars.APP_STORE_APP_IDENTIFIER }}
          APP_STORE_KEY_ISSUER_ID: ${{ vars.APP_STORE_KEY_ISSUER_ID }}
