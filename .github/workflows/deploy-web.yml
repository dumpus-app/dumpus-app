name: deploy-web

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "ios/**"
      - "src-tauri/**"
      - "infra/**"
      - "api/**"
      - "processor/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

# Serialize deploys: a queued one waits for the running one to finish.
# Without this, two pushes in quick succession can race and leave
# the bucket with one build's HTML and another's chunks.
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  SITE_BUCKET: dumpus-web-site-prod
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # Only `_next/static` is named by content hash, so only it is
          # immutable. Its old files stay: a page still running the previous
          # build, or loaded from that build's HTML mid-deploy, keeps finding
          # its chunks instead of reloading.
          aws s3 sync dist/_next/static "s3://${SITE_BUCKET}/_next/static" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else after the chunks it points at, revalidated on each
          # request: HTML, the navigation payloads (`*.txt`, the same names in
          # every build, so a cached one from an older build makes Next reload
          # the page) and `public/`, whose files keep their names across
          # versions too.
          aws s3 sync dist/ "s3://${SITE_BUCKET}/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text
